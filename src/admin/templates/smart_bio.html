<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32-v2.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16-v2.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon-v2.png">
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Green Vita">

    <title>Green Vita | کلینیک گیاه پزشکی</title>

    <link rel="stylesheet" href="/static/css/smart-bio.css">
</head>

<body>

<main class="bio-page">

    <section class="bio-card">

        <div class="bio-logo-wrap">
            <img
                src="/static/logo.png"
                alt="Green Vita"
                class="bio-logo"
            >
        </div>

        <h1>Green Vita</h1>

        <p class="bio-title">
            کلینیک گیاه پزشکی گرین ویتا
        </p>

        <p class="bio-description">
            تشخیص، درمان و نگهداری تخصصی گیاهان آپارتمانی
        </p>

        <div class="bio-links">

            <a
                href="/go/telegram"
                class="bio-link"
                data-channel="telegram"
            >
                <span class="link-icon" aria-hidden="true">
                    <img src="/static/icons/telegram.svg" alt="">
                </span>
                <span>
                    <strong>تلگرام</strong>
                    <small>دستیار هوشمند کلینیک گیاه پزشکی گرین ویتا</small>
                </span>
                <span class="link-arrow">←</span>
            </a>

            <a
                href="/go/instagram"
                class="bio-link"
                data-channel="instagram"
            >
                <span class="link-icon" aria-hidden="true">
                    <img src="/static/icons/instagram.svg" alt="">
                </span>
                <span>
                    <strong>اینستاگرام</strong>
                    <small>آموزش و محتوای گیاه پزشکی</small>
                </span>
                <span class="link-arrow">←</span>
            </a>

            <a
                href="/go/whatsapp"
                class="bio-link"
                data-channel="whatsapp"
            >
                <span class="link-icon" aria-hidden="true">
                    <img src="/static/icons/whatsapp.svg" alt="">
                </span>
                <span>
                    <strong>واتساپ</strong>
                    <small>ارسال عکس و مشاوره رایگان</small>
                </span>
                <span class="link-arrow">←</span>
            </a>

            <a
                href="/go/bale"
                class="bio-link"
                data-channel="bale"
            >
                <span class="link-icon" aria-hidden="true">
                    <img src="/static/icons/bale.svg" alt="">
                </span>
                <span>
                    <strong>پیام‌رسان بله</strong>
                    <small>آموزش و محتوای گیاه پزشکی</small>
                </span>
                <span class="link-arrow">←</span>
            </a>

        </div>

        <div class="bio-footer">
            <span>🌿</span>
            <span>اورژانس گیاهان آپارتمانی</span>
            <span>🌿</span>
        </div>

    </section>

</main>

</body>
</html>
