<div id="gv-queue-picker-root" hidden></div>

<script>
(function () {
    "use strict";

    const PERSIAN_WEEKDAYS = [
        "شنبه", "یکشنبه", "دوشنبه",
        "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه"
    ];

    const PERSIAN_MONTHS = [
        "فروردین", "اردیبهشت", "خرداد",
        "تیر", "مرداد", "شهریور",
        "مهر", "آبان", "آذر",
        "دی", "بهمن", "اسفند"
    ];

    const root = document.getElementById("gv-queue-picker-root");

    let selectedKind = null;
    let selectedRecordId = null;
    let selectedMode = "schedule";
    let currentJalali = null;
    let selectedJalali = null;
    let pendingManualStartAt = null;

    function formatPersianNumber(value) {
        return String(value).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
    }

    function jalaliToGregorian(jy, jm, jd) {
        jy += 1595;

        const days =
            -355668 +
            (365 * jy) +
            Math.floor(jy / 33) * 8 +
            Math.floor(((jy % 33) + 3) / 4) +
            jd +
            (jm < 7
                ? (jm - 1) * 31
                : ((jm - 7) * 30) + 186);

        let gy = 400 * Math.floor(days / 146097);
        let gd = days % 146097;

        if (gd > 36524) {
            gy += 100 * Math.floor(--gd / 36524);
            gd %= 36524;

            if (gd >= 365) {
                gd++;
            }
        }

        gy += 4 * Math.floor(gd / 1461);
        gd %= 1461;

        if (gd > 365) {
            gy += Math.floor((gd - 1) / 365);
            gd = (gd - 1) % 365;
        }

        let gdYear = gy;
        const leap = !(gdYear % 4) &&
            ((gdYear % 100) || !(gdYear % 400));

        const monthDays = [
            31, leap ? 29 : 28, 31, 30, 31, 30,
            31, 31, 30, 31, 30, 31
        ];

        let gm = 0;
        while (gm < 12 && gd >= monthDays[gm]) {
            gd -= monthDays[gm];
            gm++;
        }

        return [gdYear, gm + 1, gd + 1];
    }

    function gregorianToJalali(gy, gm, gd) {
        const gdm = [
            0, 31, 59, 90, 120, 151,
            181, 212, 243, 273, 304, 334
        ];

        let gy2 = gm > 2 ? gy + 1 : gy;

        let days =
            355666 +
            (365 * gy) +
            Math.floor((gy2 + 3) / 4) -
            Math.floor((gy2 + 99) / 100) +
            Math.floor((gy2 + 399) / 400) +
            gd +
            gdm[gm - 1];

        let jy = -1595 + 33 * Math.floor(days / 12053);

        days %= 12053;

        jy += 4 * Math.floor(days / 1461);

        days %= 1461;

        if (days > 365) {
            jy += Math.floor((days - 1) / 365);
            days = (days - 1) % 365;
        }

        const jm = days < 186
            ? 1 + Math.floor(days / 31)
            : 7 + Math.floor((days - 186) / 30);

        const jd = 1 +
            (days < 186
                ? days % 31
                : (days - 186) % 30);

        return [jy, jm, jd];
    }

    function jalaliToDate(jy, jm, jd, hour = 0, minute = 0) {
        const [gy, gm, gd] = jalaliToGregorian(jy, jm, jd);

        return new Date(
            gy,
            gm - 1,
            gd,
            hour,
            minute,
            0,
            0
        );
    }

    function jalaliNow() {
        const now = new Date();

        return gregorianToJalali(
            now.getFullYear(),
            now.getMonth() + 1,
            now.getDate()
        );
    }

    function formatPersianDate(jalali) {
        return `${PERSIAN_WEEKDAYS[jalaliDayOfWeek(...jalali)]} ${formatPersianNumber(jalali[2])} ${PERSIAN_MONTHS[jalali[1] - 1]} ${formatPersianNumber(jalali[0])}`;
    }

    function jalaliAddDays(jalali, delta) {
        const date = jalaliToDate(
            jalali[0],
            jalali[1],
            jalali[2],
            12,
            0
        );

        date.setDate(date.getDate() + delta);

        return gregorianToJalali(
            date.getFullYear(),
            date.getMonth() + 1,
            date.getDate()
        );
    }

    function sameJalali(a, b) {
        return a && b &&
            a[0] === b[0] &&
            a[1] === b[1] &&
            a[2] === b[2];
    }

    function isJalaliBefore(a, b) {
        if (!a || !b) {
            return false;
        }

        if (a[0] !== b[0]) {
            return a[0] < b[0];
        }

        if (a[1] !== b[1]) {
            return a[1] < b[1];
        }

        return a[2] < b[2];
    }

    function jalaliDayOfWeek(jy, jm, jd) {
        const date = jalaliToDate(jy, jm, jd);
        return (date.getDay() + 1) % 7;
    }

    async function api(url, options = {}) {
        const response = await fetch(
            url,
            {
                credentials: "same-origin",
                ...options,
                headers: {
                    "Accept": "application/json",
                    ...(options.headers || {})
                }
            }
        );

        const type =
            response.headers.get("content-type") || "";

        const data = type.includes("application/json")
            ? await response.json()
            : { detail: await response.text() };

        if (!response.ok) {
            throw new Error(
                data?.detail || `خطای ${response.status}`
            );
        }

        return data;
    }

    function openPicker(kind, recordId) {
        selectedMode = "schedule";
        pendingManualStartAt = null;

        selectedKind = kind;
        selectedRecordId = Number(recordId);

        const today = jalaliNow();

        currentJalali = today;
        selectedJalali = today;

        root.hidden = false;

        renderPicker();
        loadSlots();
    }

    window.openManualPhonePicker = function () {
        selectedMode = "manual";
        pendingManualStartAt = null;

        selectedKind = null;
        selectedRecordId = null;

        const today = jalaliNow();

        currentJalali = today;
        selectedJalali = today;

        root.hidden = false;

        renderPicker();
        loadSlots();
    };

    function closePicker() {
        root.hidden = true;
        selectedKind = null;
        selectedRecordId = null;
        selectedMode = "schedule";
        pendingManualStartAt = null;
    }

    function renderPicker() {
        const days = [];

        for (let i = 0; i < 7; i++) {
            days.push(
                jalaliAddDays(currentJalali, i)
            );
        }

        root.innerHTML = `
            <div class="gv-queue-picker-backdrop">
                <div class="gv-queue-picker">
                    <div class="gv-queue-picker-head">
                        <div>
                            <div class="gv-queue-picker-title">
                                ${
                                    selectedMode === "manual"
                                        ? "ثبت نوبت تلفنی"
                                        : "انتخاب زمان ویزیت"
                                }
                            </div>
                            <div class="gv-queue-picker-subtitle">
                                ${
                                    selectedMode === "manual"
                                        ? "انتخاب زمان و سپس تکمیل مشخصات مشتری"
                                        : `درخواست #${selectedKind === "identification" ? "I-" : "D-"}${selectedRecordId}`
                                }
                            </div>

                        </div>

                        <button
                            type="button"
                            class="gv-queue-picker-close"
                            data-queue-close
                        >×</button>
                    </div>

                    <div class="gv-queue-nav">
                        <button
                            type="button"
                            class="prev-week"
                            data-queue-prev
                        >
                            ‹ هفته قبل
                        </button>

                        <button
                            type="button"
                            class="gv-queue-today-btn"
                            data-queue-today
                        >
                            امروز (${formatPersianDate(jalaliNow())})
                        </button>

                        <button
                            type="button"
                            class="next-week"
                            data-queue-next
                        >
                            هفته بعد ›
                        </button>
                    </div>

                    <div class="gv-queue-days">
                        ${days.map(day => `
                            <button
                                type="button"
                                class="gv-queue-day ${sameJalali(day, selectedJalali) ? "is-selected" : ""}"
                                data-queue-day="${day.join("-")}"
                            >
                                <span class="day-name">
                                    ${PERSIAN_WEEKDAYS[jalaliDayOfWeek(...day)]}
                                </span>
                                <span class="day-number">
                                    ${formatPersianNumber(day[2])} ${PERSIAN_MONTHS[day[1] - 1]}
                                    <span class="day-year">
                                        ${formatPersianNumber(day[0])}
                                    </span>
                                </span>
                            </button>
                        `).join("")}
                    </div>

                    <div class="gv-queue-status" id="gv-queue-slot-status">
                        در حال بررسی زمان‌های آزاد...
                    </div>

                    <div class="gv-queue-slots" id="gv-queue-slots"></div>

                    <div id="gv-queue-manual-form-root"></div>
                </div>
            </div>
        `;
    }

    async function loadSlots() {
        const container =
            document.getElementById("gv-queue-slots");

        const status =
            document.getElementById("gv-queue-slot-status");

        if (!container || !selectedJalali) {
            return;
        }

        container.innerHTML = "";

        const today = jalaliNow();

        if (isJalaliBefore(selectedJalali, today)) {
            status.textContent =
                "این روز گذشته است و زمان‌های آن قابل انتخاب نیستند.";

            return;
        }

        status.textContent =
            "در حال بررسی زمان‌های آزاد...";

        try {
            const start = jalaliToDate(
                selectedJalali[0],
                selectedJalali[1],
                selectedJalali[2],
                9,
                0
            );

            const end = jalaliToDate(
                selectedJalali[0],
                selectedJalali[1],
                selectedJalali[2],
                18,
                0
            );

            const params = new URLSearchParams({
                start_at: start.toISOString(),
                end_at: end.toISOString(),
                step_minutes: "60"
            });

            const data = await api(
                `/api/calendar/slots?${params.toString()}`
            );

            const slots = data.slots || [];

            if (!slots.length) {
                status.textContent =
                    "در این روز زمانی برای انتخاب وجود ندارد.";
                return;
            }

            const available = slots.filter(
                slot => slot.available
            );

            if (!available.length) {
                status.textContent =
                    "در این روز هیچ زمان آزادی وجود ندارد.";
            } else {
                status.textContent =
                    `${formatPersianNumber(available.length)} زمان آزاد پیدا شد.`;
            }

            slots.forEach(slot => {
                const button =
                    document.createElement("button");

                button.type = "button";
                const slotDate = new Date(slot.start_at);
                const slotDay = gregorianToJalali(
                    slotDate.getFullYear(),
                    slotDate.getMonth() + 1,
                    slotDate.getDate()
                );

                const pastSlot =
                    isJalaliBefore(slotDay, today);

                button.className =
                    "gv-queue-slot" +
                    ((!slot.available || pastSlot) ? " busy" : "");

                button.disabled =
                    !slot.available || pastSlot;

                const dt = new Date(slot.start_at);

                button.textContent =
                    `${formatPersianNumber(String(dt.getHours()).padStart(2, "0"))}:${formatPersianNumber(String(dt.getMinutes()).padStart(2, "0"))}`;

                if (pastSlot) {
                    button.textContent += " · گذشته";
                } else if (!slot.available) {
                    button.textContent += " · رزرو شده";
                }

                button.dataset.queueStartAt =
                    slot.start_at;

                container.appendChild(button);
            });

        } catch (error) {
            status.textContent =
                error.message || "خطا در دریافت زمان‌های آزاد";
        }
    }

                <div

                ></div>

                <div class="gv-queue-manual-actions">
                    <button
                        type="button"
                        class="gv-queue-picker-close"
                        id="gv-manual-back"
                    >
                        تغییر زمان
                    </button>

                    <button
                        type="submit"
                        class="gv-queue-manual-submit"
                        id="gv-manual-submit"
                    >
                        ثبت نوبت تلفنی
                    </button>
                </div>
            </form>
        `;

        const form =
            document.getElementById("gv-queue-manual-form");

        const back =
            document.getElementById("gv-manual-back");

        const errorBox =
            document.getElementById("gv-queue-manual-error");

        const submit =
            document.getElementById("gv-manual-submit");

        back.addEventListener("click", () => {
            pendingManualStartAt = null;
            rootForm.innerHTML = "";
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            // iOS Safari: release input focus and restore normal page scale.
            if (document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
            }

            const viewport = document.querySelector('meta[name="viewport"]');
            const originalViewport = viewport ? viewport.getAttribute("content") : null;

            if (viewport) {
                viewport.setAttribute(
                    "content",
                    "width=device-width, initial-scale=1, maximum-scale=1"
                );
            }

            window.scrollTo(0, window.scrollY);

            setTimeout(() => {
                if (viewport && originalViewport) {
                    viewport.setAttribute("content", originalViewport);
                }
            }, 250);

            errorBox.style.display = "none";
            submit.disabled = true;
            submit.textContent = "در حال ثبت...";

            const params = new URLSearchParams({
                start_at: pendingManualStartAt || "",
                customer_name:
                    document.getElementById(
                        "gv-manual-customer-name"
                    ).value.trim(),
                customer_phone:
                    document.getElementById(
                        "gv-manual-customer-phone"
                    ).value.trim(),
                customer_plant:
                    document.getElementById(
                        "gv-manual-plant"
                    ).value.trim(),
                customer_address:
                    document.getElementById(
                        "gv-manual-address"
                    ).value.trim(),
                customer_description:
                    document.getElementById(
                        "gv-manual-description"
                    ).value.trim(),
            });

            if (!params.get("customer_name")) {
                errorBox.textContent =
                    "نام و نام خانوادگی الزامی است.";
                errorBox.style.display = "block";
                submit.disabled = false;
                submit.textContent = "ثبت نوبت تلفنی";
                return;
            }

            if (!params.get("customer_phone")) {
                errorBox.textContent =
                    "شماره تلفن الزامی است.";
                errorBox.style.display = "block";
                submit.disabled = false;
                submit.textContent = "ثبت نوبت تلفنی";
                return;
            }

            try {
                const result = await api(
                    "/api/calendar/manual-appointments?" +
                    params.toString(),
                    {
                        method: "POST",
                    }
                );

                if (result.success === false) {
                    throw new Error(
                        result.error ||
                        "ثبت نوبت انجام نشد."
                    );
                }

                closePicker();

                alert(
                    "نوبت تلفنی با موفقیت ثبت شد."
                );

                window.location.reload();

            } catch (error) {
                errorBox.textContent =
                    error.message ||
                    "ثبت نوبت انجام نشد.";

                errorBox.style.display = "block";

                submit.disabled = false;
                submit.textContent = "ثبت نوبت تلفنی";
            }
        });

        // iOS Safari: keep the page at its normal scale after form focus.
        requestAnimationFrame(() => {
            if (document.activeElement && typeof document.activeElement.blur === "function") {
                document.activeElement.blur();
            }

            const viewport = window.visualViewport;
            if (viewport && viewport.scale && viewport.scale !== 1) {
                window.scrollTo(0, window.scrollY);
            }
        });

        rootForm.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
        });

        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                window.scrollTo(0, window.scrollY);
            });
        });
    }

    async function scheduleSelected(startAt) {
        const params = new URLSearchParams({
            start_at: startAt
        });

        const response = await fetch(
            `/api/visit-queue/${selectedKind}/${selectedRecordId}/schedule`,
            {
                method: "POST",
                credentials: "same-origin",
                body: params
            }
        );

        if (!response.ok && response.status !== 303) {
            let detail = "خطا در ثبت زمان ویزیت";

            try {
                const data = await response.json();
                detail = data.detail || detail;
            } catch (_) {}

            throw new Error(detail);
        }

        window.location.reload();
    }

    root.addEventListener("click", event => {
        if (event.target.closest("[data-queue-close]")) {
            closePicker();
            return;
        }

        const dayButton =
            event.target.closest("[data-queue-day]");

        if (dayButton) {
            selectedJalali =
                dayButton.dataset.queueDay
                    .split("-")
                    .map(Number);

            renderPicker();
            loadSlots();
            return;
        }

        if (event.target.closest("[data-queue-prev]")) {
            currentJalali =
                jalaliAddDays(currentJalali, -7);

            selectedJalali = currentJalali;

            renderPicker();
            loadSlots();
            return;
        }

        if (event.target.closest("[data-queue-next]")) {
            currentJalali =
                jalaliAddDays(currentJalali, 7);

            selectedJalali = currentJalali;

            renderPicker();
            loadSlots();
            return;
        }

        if (event.target.closest("[data-queue-today]")) {
            currentJalali = jalaliNow();
            selectedJalali = currentJalali;

            renderPicker();
            loadSlots();
            return;
        }

        const slot =
            event.target.closest("[data-queue-start-at]");

        if (slot && !slot.disabled) {
            if (selectedMode === "manual") {
                showManualForm(
                    slot.dataset.queueStartAt
                );
                return;
            }

            scheduleSelected(
                slot.dataset.queueStartAt
            ).catch(error => {
                const status =
                    document.getElementById(
                        "gv-queue-slot-status"
                    );

                if (status) {
                    status.textContent =
                        error.message || "خطا در ثبت زمان";
                }
            });
        }
    });

    document.addEventListener("click", event => {
        const button =
            event.target.closest(
                "[data-queue-schedule-kind]"
            );

        if (!button) {
            return;
        }

        openPicker(
            button.dataset.queueScheduleKind,
            button.dataset.queueScheduleId
        );
    });
})();
</script>
