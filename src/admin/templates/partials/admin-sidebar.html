<!-- GV_UNSCHEDULED_VISITS_BADGE -->
<script>
(() => {
    const badge = document.getElementById("gv-unscheduled-visits-badge");

    if (!badge) return;

    async function updateUnscheduledVisitsBadge() {
        try {
            const response = await fetch(
                "/dashboard/api/unscheduled-visits-count",
                {
                    credentials: "same-origin",
                    cache: "no-store",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            if (!response.ok) {
                throw new Error("unscheduled visits badge request failed");
            }

            const data = await response.json();
            const count = Math.max(0, Number(data.count || 0));

            const persianCount = count
                .toLocaleString("fa-IR");

            badge.textContent = persianCount;
            badge.title =
                persianCount + " ویزیت زمان‌بندی‌نشده";

            if (count > 0) {
                badge.hidden = false;
            } else {
                badge.hidden = true;
            }
        } catch (error) {
            console.error(
                "Green Vita unscheduled visits badge:",
                error
            );
        }
    }

    updateUnscheduledVisitsBadge();

    setInterval(
        updateUnscheduledVisitsBadge,
        30000
    );
})();
</script>
