<!-- GV MOBILE HEADER SCRIPT START -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const header = document.querySelector(".site-header");
  const toggle = document.querySelector(".gv-mobile-toggle");

  if (!header || !toggle) return;

  const closeMenu = () => {
    header.classList.remove("gv-mobile-open");
    toggle.setAttribute("aria-expanded", "false");
  };

  toggle.addEventListener("click", () => {
    const open = header.classList.toggle("gv-mobile-open");

    toggle.setAttribute(
      "aria-expanded",
      open ? "true" : "false"
    );
  });

  header.querySelectorAll(".menu a").forEach(link => {
    link.addEventListener("click", closeMenu);
  });

  document.addEventListener("click", event => {
    if (
      header.classList.contains("gv-mobile-open") &&
      !header.contains(event.target)
    ) {
      closeMenu();
    }
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      closeMenu();
    }
  });

  window.addEventListener("resize", closeMenu);
});
</script>
<!-- GV MOBILE HEADER SCRIPT END -->

<script id="gv-persistent-header-no-lines">
(function () {
  const STYLE_ID = "gv-persistent-header-no-lines-style";

  const css = `
    html body header.site-header::before,
    html body header.site-header::after,
    html body header.site-header > .nav::before,
    html body header.site-header > .nav::after {
      content: none !important;
      display: none !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
    }
  `;

  function ensureStyle() {
    let s = document.getElementById(STYLE_ID);
    if (!s) {
      s = document.createElement("style");
      s.id = STYLE_ID;
      (document.head || document.documentElement).appendChild(s);
    }
    if (s.textContent !== css) s.textContent = css;
  }

  const watched = new WeakSet();
  const observer = new MutationObserver(function () {
    enforce();
  });

  function lockProperties(el) {
    if (!el) return;

    [
      ["border", "0px"],
      ["border-bottom", "0px"],
      ["border-top", "0px"],
      ["outline", "none"],
      ["box-shadow", "none"]
    ].forEach(function (item) {
      const prop = item[0], value = item[1];
      if (
        el.style.getPropertyValue(prop).trim() !== value ||
        el.style.getPropertyPriority(prop) !== "important"
      ) {
        el.style.setProperty(prop, value, "important");
      }
    });

    if (!watched.has(el)) {
      watched.add(el);
      observer.observe(el, {
        attributes: true,
        attributeFilter: ["style", "class"]
      });
    }
  }

  function enforce() {
    ensureStyle();
    const h = document.querySelector("header.site-header");
    if (!h) return;
    lockProperties(h);
    lockProperties(h.querySelector(".nav"));
  }

  enforce();

  // اگر اسکریپتی هدر را بازسازی کند نیز اصلاح دوباره اعمال می‌شود.
  const pageObserver = new MutationObserver(function () {
    enforce();
  });

  pageObserver.observe(document.documentElement, {
    childList: true,
    subtree: true
  });

  window.addEventListener("pageshow", enforce);
})();
</script>

<!-- GV-HEADER-BOTTOM-EDGE-SHADOW-SCRIPT-START -->
<script id="gv-header-bottom-edge-final-script">
(() => {
  const header = document.querySelector("header.site-header");
  if (!header || !document.body) return;

  const cleanupKey = "__gvHeaderBottomEdgeFinalCleanup";
  if (typeof window[cleanupKey] === "function") window[cleanupKey]();

  let edge = document.getElementById("gv-header-bottom-edge-final");
  if (!edge) {
    edge = document.createElement("span");
    edge.id = "gv-header-bottom-edge-final";
    edge.setAttribute("aria-hidden", "true");
  }
  if (edge.parentElement !== header) header.appendChild(edge);

  let shadow = document.getElementById("gv-header-bottom-shadow-final");
  if (!shadow) {
    shadow = document.createElement("div");
    shadow.id = "gv-header-bottom-shadow-final";
    shadow.setAttribute("aria-hidden", "true");
  }
  if (shadow.parentElement !== document.body) document.body.appendChild(shadow);

  const update = () => {
    const rect = header.getBoundingClientRect();
    shadow.style.left = (rect.left + 12) + "px";
    shadow.style.width = Math.max(0, rect.width - 24) + "px";
    shadow.style.top = (rect.bottom - 1) + "px";
  };

  window.addEventListener("resize", update, { passive: true });
  window.addEventListener("scroll", update, { passive: true });

  let observer = null;
  if ("ResizeObserver" in window) {
    observer = new ResizeObserver(update);
    observer.observe(header);
  }

  window[cleanupKey] = () => {
    window.removeEventListener("resize", update);
    window.removeEventListener("scroll", update);
    if (observer) observer.disconnect();
  };

  update();
  requestAnimationFrame(update);
})();
</script>
<!-- GV-HEADER-BOTTOM-EDGE-SHADOW-SCRIPT-END -->
