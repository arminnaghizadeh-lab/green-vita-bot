<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    
    
    
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">
    <meta name="apple-mobile-web-app-title"
          content="Green Vita">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Green Vita{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/global-vazir.css?v=1">

    <style>
        :root{
            --green:#2f6b3f;
            --green-dark:#234f2f;
            --cream:#f7f1e3;
            --cream-dark:#eadfca;
            --white:#fffdf8;
            --text:#203127;
            --muted:#667268;
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            background:
                radial-gradient(circle at 90% 0%,rgba(47,107,63,.12),transparent 30%),
                linear-gradient(180deg,#fbf8ef 0%,var(--cream) 100%);
            color:var(--text);
            min-height:100vh;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        .site-header{
            position:sticky;
            top:0;
            z-index:50;
            backdrop-filter:blur(14px);
            background:rgba(247,241,227,.9);
            border-bottom:1px solid rgba(47,107,63,.12);
        }

        .nav{
            max-width:1180px;
            margin:auto;
            min-height:74px;
            padding:0 20px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:24px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            font-weight:900;
            color:var(--green-dark);
            font-size:21px;
        }

        .brand-mark{
            width:42px;
            height:42px;
            border-radius:14px;
            display:grid;
            place-items:center;
            background:var(--green);
            color:white;
            font-size:21px;
            box-shadow:0 10px 25px rgba(35,79,47,.18);
        }

        .menu{
            display:flex;
            align-items:center;
            gap:6px;
            flex-wrap:wrap;
        }

        .menu a{
            padding:9px 13px;
            border-radius:10px;
            color:#4d5b51;
            font-weight:700;
            transition:.2s;
        }

        .menu a:hover{
            background:rgba(47,107,63,.08);
            color:var(--green-dark);
        }

        .menu .cta{
            background:var(--green);
            color:white;
            padding:10px 16px;
        }

        .container{
            max-width:1180px;
            margin:auto;
            padding:0 20px;
        }

        .hero{
            padding:82px 0 58px;
        }

        .hero-grid{
            display:grid;
            grid-template-columns:1.15fr .85fr;
            gap:45px;
            align-items:center;
        }

        .eyebrow{
            display:inline-flex;
            align-items:center;
            gap:7px;
            padding:8px 13px;
            border-radius:999px;
            background:rgba(47,107,63,.09);
            color:var(--green-dark);
            font-weight:800;
            font-size:14px;
        }

        h1{
            margin:18px 0 16px;
            font-size:clamp(36px,5vw,62px);
            line-height:1.25;
            color:var(--green-dark);
        }

        .hero p{
            margin:0;
            max-width:680px;
            color:var(--muted);
            font-size:18px;
            line-height:2;
        }

        .hero-actions{
            margin-top:28px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:48px;
            padding:0 20px;
            border-radius:14px;
            font-weight:800;
            border:1px solid rgba(47,107,63,.16);
        }

        .btn-primary{
            background:var(--green);
            color:#fff;
            border-color:var(--green);
            box-shadow:0 10px 25px rgba(47,107,63,.18);
        }

        .btn-secondary{
            background:rgba(255,255,255,.7);
        }

        .hero-card{
            min-height:360px;
            border-radius:32px;
            padding:30px;
            background:
                radial-gradient(circle at 25% 25%,rgba(255,255,255,.45),transparent 28%),
                linear-gradient(145deg,#dae8d8,#f0ead8);
            display:flex;
            align-items:flex-end;
            box-shadow:0 25px 60px rgba(35,79,47,.12);
        }

        .hero-card-content{
            width:100%;
            background:rgba(255,253,248,.82);
            border:1px solid rgba(255,255,255,.7);
            border-radius:22px;
            padding:22px;
            backdrop-filter:blur(10px);
        }

        .hero-card-content strong{
            display:block;
            color:var(--green-dark);
            font-size:24px;
            margin-bottom:8px;
        }

        .section{
            padding:55px 0;
        }

        .section-head{
            margin-bottom:28px;
        }

        .section-head h2{
            margin:0 0 8px;
            color:var(--green-dark);
            font-size:34px;
        }

        .section-head p{
            margin:0;
            color:var(--muted);
        }

        .services{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:18px;
        }

        .service{
            background:rgba(255,253,248,.92);
            border:1px solid rgba(47,107,63,.1);
            border-radius:22px;
            padding:22px;
            box-shadow:0 12px 30px rgba(35,79,47,.06);
        }

        .service-icon{
            width:48px;
            height:48px;
            border-radius:16px;
            display:grid;
            place-items:center;
            background:rgba(47,107,63,.08);
            font-size:23px;
            margin-bottom:16px;
        }

        .service h3{
            margin:0 0 10px;
            line-height:1.6;
            color:var(--green-dark);
        }

        .service p{
            min-height:56px;
            color:var(--muted);
            line-height:1.8;
            font-size:14px;
        }

        .service-price{
            margin:16px 0;
            font-weight:900;
            color:var(--green);
            line-height:1.8;
        }

        .service .btn{
            width:100%;
        }

        .feature-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:18px;
        }

        .feature{
            padding:25px;
            border-radius:22px;
            background:rgba(255,255,255,.58);
            border:1px solid rgba(47,107,63,.08);
        }

        .feature strong{
            display:block;
            color:var(--green-dark);
            font-size:19px;
            margin-bottom:8px;
        }

        .feature p{
            margin:0;
            color:var(--muted);
            line-height:1.9;
        }

        .tracking{
            background:var(--green-dark);
            color:white;
            border-radius:28px;
            padding:34px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:24px;
        }

        .tracking h2{
            margin:0 0 8px;
        }

        .tracking p{
            margin:0;
            color:rgba(255,255,255,.78);
        }

        .tracking .btn{
            background:white;
            color:var(--green-dark);
            border:0;
            white-space:nowrap;
        }

        .site-footer{
            margin-top:60px;
            border-top:1px solid rgba(47,107,63,.1);
            padding:26px 0;
            color:var(--muted);
        }

        .footer-inner{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            flex-wrap:wrap;
        }

        .page{
            padding:70px 0;
        }

        .page-card{
            max-width:900px;
            margin:auto;
            background:rgba(255,253,248,.94);
            border:1px solid rgba(47,107,63,.1);
            border-radius:28px;
            padding:42px;
            box-shadow:0 15px 40px rgba(35,79,47,.07);
        }

        .page-card h1{
            font-size:42px;
            margin-top:0;
        }

        .page-card h2{
            color:var(--green-dark);
            margin-top:30px;
        }

        .page-card p{
            color:var(--muted);
            line-height:2;
        }

        @media(max-width:900px){
            .hero-grid{grid-template-columns:1fr}
            .services{grid-template-columns:repeat(2,1fr)}
            .feature-grid{grid-template-columns:1fr}
        }

        @media(max-width:650px){
            .nav{align-items:flex-start;padding-top:12px;padding-bottom:12px;flex-direction:column}
            .menu{width:100%;overflow:auto;flex-wrap:nowrap}
            .menu a{white-space:nowrap}
            .hero{padding-top:50px}
            .services{grid-template-columns:1fr}
            .tracking{align-items:flex-start;flex-direction:column}
            .tracking .btn{width:100%}
            .page-card{padding:26px}
        }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=gvlogo-20260907">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=gvlogo-20260907">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=gvlogo-20260907">
</head>

<body>

<header class="site-header">
    <nav class="nav">
        <a href="/" class="brand">
            <span class="brand-mark">🌿</span>
            <span>Green Vita</span>
        </a>

        <div class="menu">
            <a href="/">خانه</a>
            <a href="/about/">درباره ما</a>
            <a href="/contact/">تماس با ما</a>
            <a href="/booking/track/">پیگیری رزرو</a>
            <a href="/booking/" class="cta">رزرو آنلاین</a>
        </div>
    </nav>
</header>

{% block content %}{% endblock %}

<footer class="site-footer">
    <div class="container footer-inner">
        <strong>Green Vita · کلینیک گیاه پزشکی</strong>
        <span>سلامت گیاه، با دانش و مراقبت تخصصی</span>
    </div>
</footer>

</body>
</html>
