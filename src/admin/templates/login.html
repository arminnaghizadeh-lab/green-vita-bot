{% extends "base.html" %}

{% block title %}ورود به پنل | Green Vita{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-lg border border-gray-100 p-8 w-full max-w-md">

        <div class="text-center mb-8">
            <div class="text-4xl mb-3">🌿</div>
            <h1 class="text-2xl font-bold text-gray-800">
                ورود به پنل مدیریت
            </h1>
            <p class="text-gray-500 text-sm mt-2">
                کلینیک گیاهپزشکی گرین ویتا
            </p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-xl p-3 mb-5 text-sm">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">

            <div>
                <label class="block text-sm font-medium mb-2">
                    نام کاربری
                </label>
                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    required
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
            </div>

            <div>
                <label class="block text-sm font-medium mb-2">
                    رمز عبور
                </label>
                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                    class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl py-3 transition"
            >
                ورود به پنل
            </button>

        </form>
    </div>
</div>
{% endblock %}
