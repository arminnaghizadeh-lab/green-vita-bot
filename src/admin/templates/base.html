<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Green Vita Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tahoma', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
    <nav class="bg-emerald-700 text-white px-6 py-4 flex items-center justify-between shadow">
        <span class="font-bold text-lg">🌿 Green Vita — پنل مدیریت</span>
        <span class="text-sm opacity-80">{{ environment | default('') }}</span>
    </nav>
    <main class="p-6 max-w-5xl mx-auto">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
