<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    
    
    
    <link rel="manifest" href="/static/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">
    <meta name="apple-mobile-web-app-title"
          content="Green Vita">
    <title>{% block title %}Green Vita Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/admin.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --gv-green: #2f6b3f;
            --gv-green-dark: #234f2f;
            --gv-cream: #f7f1e3;
            --gv-cream-dark: #eadfca;
        }

        body {
            background:
                radial-gradient(circle at top right, rgba(47,107,63,.08), transparent 28%),
                var(--gv-cream);
        }
    </style>
    <link rel="stylesheet" href="/static/css/global-vazir.css?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=gvlogo-20260907">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png?v=gvlogo-20260907">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png?v=gvlogo-20260907">
</head>

<body class="min-h-screen text-gray-800">

{% block content %}{% endblock %}

</body>
</html>
