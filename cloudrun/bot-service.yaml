# Cloud Run service definition — Telegram Bot
# اعمال با: gcloud run services replace cloudrun/bot-service.yaml --region <REGION>
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: green-vita-bot
  labels:
    app: green-vita
    component: bot
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1" # بات polling باید فقط یک نمونه باشد
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/green-vita/bot:latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: production
            - name: BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: green-vita-bot-token
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: green-vita-database-url
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: green-vita-redis-url
                  key: latest
            - name: AI_PROVIDER
              value: claude
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: green-vita-anthropic-key
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
