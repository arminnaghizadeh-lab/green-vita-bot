[project]
name = "green-vita-bot"
version = "0.1.0"
description = "Green Vita AI Plant Clinic - Telegram bot + Admin dashboard"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "aiogram==3.15.0",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",
    "redis==5.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "anthropic==0.42.0",
    "google-generativeai==0.8.3",
    "openai==1.58.1",
    "python-dotenv==1.0.1",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "aiosqlite==0.20.0",
    "factory-boy==3.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
